[package]
name = "nova-launcher"
version = "0.1.0"
description = "Nova Launcher"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nova_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

parking_lot = "0.12"

# WebView2 profile switches (autofill / password autosave). Versions match what
# wry and tauri-runtime-wry already resolve, so the lockfile keeps one copy.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# Java discovery reads the installer keys (JavaSoft, Adoptium, Microsoft, ...).
winreg = "0.55"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
